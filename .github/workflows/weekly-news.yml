name: Weekly AI & GitHub Competitor News

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
    - name: Generate news report
      run: |
        python news_agent.py --output weekly_news_$(date +%Y%m%d).md
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'Add weekly AI & GitHub competitor news update'
        title: 'Weekly Tech News Update - ${{ steps.date.outputs.date }}'
        body: |
          ## Weekly AI & GitHub Competitor News Update
          
          This automated PR contains the latest weekly news updates about AI developments and GitHub competitors.
          
          **Generated on:** ${{ steps.date.outputs.date }}
          **Workflow run:** ${{ github.run_id }}
          
          Please review the generated news report and merge if the content looks good.
          
        branch: weekly-news-${{ github.run_id }}
        delete-branch: true
        
    - name: Upload news report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: weekly-news-report
        path: weekly_news_*.md
        retention-days: 30